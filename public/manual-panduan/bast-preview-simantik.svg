<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#F1F8EF"/>
    </linearGradient>
    <linearGradient id="paper" x1="320" y1="150" x2="1280" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAF9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <rect x="210" y="80" width="1180" height="840" rx="28" fill="#111827"/>
