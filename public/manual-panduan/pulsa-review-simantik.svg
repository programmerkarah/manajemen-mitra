  <text x="790" y="468" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#475569">Pengguna dapat menilai, menandai, atau meneruskan hasil review.</text>
  <rect x="760" y="530" width="290" height="180" rx="20" fill="#ECFDF5" stroke="#86EFAC"/>
