  <text x="514" y="370" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">1. Pilih menu di sidebar</text>
  <text x="514" y="402" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Menu aktif berubah warna untuk menandai halaman yang sedang dibuka.</text>
  <text x="514" y="482" fill="#15803D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2. Baca isi panel</text>
  <text x="514" y="514" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Konten utama berganti sesuai modul yang dipilih.</text>
  <text x="514" y="594" fill="#7C3AED" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">3. Lakukan tindakan</text>
  <text x="514" y="626" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Dari halaman yang sama, pengguna dapat menambah, mengubah, atau memeriksa data.</text>
  <text x="514" y="706" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">4. Kembali ke menu lain</text>
  <text x="514" y="738" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Sidebar tetap tersedia untuk berpindah ke alur berikutnya tanpa keluar dari aplikasi.</text>
