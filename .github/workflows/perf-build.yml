name: temporary-performance-build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Timed production build
        run: |
          /usr/bin/time -v npm run build
          echo "BUILD_BYTES=$(du -sb public/build | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_FILES=$(find public/build -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
