name: temporary-ui-build

on:
  push:
    branches:
      - ui-card-unify-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: npm run build
