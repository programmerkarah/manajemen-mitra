name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Resolve Composer Cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check PHP Formatting
        shell: bash
        run: |
          files="$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.php')"
          if [ -z "$files" ]; then
            echo "No changed PHP files to format-check."
            exit 0
          fi

          echo "$files"
          vendor/bin/pint --test -v -- $files

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check Frontend Formatting
        shell: bash
        run: |
          files="$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- resources/js resources/css)"
          if [ -z "$files" ]; then
            echo "No changed frontend files to format-check."
            exit 0
          fi

          echo "$files"
          ./node_modules/.bin/prettier --check $files

      - name: Lint Frontend
        shell: bash
        run: |
          files="$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- 'resources/js/**/*.js' 'resources/js/**/*.jsx' 'resources/js/**/*.ts' 'resources/js/**/*.tsx')"
          if [ -z "$files" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi

          echo "$files"
          ./node_modules/.bin/eslint $files
