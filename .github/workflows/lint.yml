name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Resolve Composer Cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check PHP Formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.php')
          if (( ${#files[@]} == 0 )); then
            echo "No changed PHP files to format-check."
            exit 0
          fi

          printf 'Checking PHP formatting for:\n%s\n' "${files[*]}"
          vendor/bin/pint --test -- "${files[@]}"

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Resolve Changed Frontend Files
        id: changed-frontend
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- resources/js resources/css > /tmp/frontend-files.txt
          grep -E '\.(js|jsx|ts|tsx)

      - name: Check Frontend Formatting
        shell: bash
        run: |
          mapfile -t files < /tmp/frontend-files.txt
          if (( ${#files[@]} == 0 )); then
            echo "No changed frontend files to format-check."
            exit 0
          fi

          printf 'Checking frontend formatting for:\n%s\n' "${files[*]}"
          ./node_modules/.bin/prettier --check "${files[@]}"

      - name: Lint Frontend
        shell: bash
        run: |
          mapfile -t files < /tmp/eslint-files.txt
          if (( ${#files[@]} == 0 )); then
            echo "No changed JS/TS files to lint."
            exit 0
          fi

          printf 'Linting frontend files:\n%s\n' "${files[*]}"
          ./node_modules/.bin/eslint "${files[@]}"
 /tmp/frontend-files.txt > /tmp/eslint-files.txt || true

      - name: Check Frontend Formatting
        shell: bash
        run: |
          mapfile -t files < /tmp/frontend-files.txt
          if (( ${#files[@]} == 0 )); then
            echo "No changed frontend files to format-check."
            exit 0
          fi

          printf 'Checking frontend formatting for:\n%s\n' "${files[*]}"
          ./node_modules/.bin/prettier --check "${files[@]}"

      - name: Lint Frontend
        shell: bash
        run: |
          mapfile -t files < /tmp/eslint-files.txt
          if (( ${#files[@]} == 0 )); then
            echo "No changed JS/TS files to lint."
            exit 0
          fi

          printf 'Linting frontend files:\n%s\n' "${files[*]}"
          ./node_modules/.bin/eslint "${files[@]}"
